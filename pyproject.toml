[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiroyukigpu-http-status-cli"
version = "1.0.0"
description = "複数URLのHTTPステータスと応答時間を一括表示します。"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HiroyukiGPU"}]
dependencies = ["certifi>=2024.2.2", ]

[project.scripts]
http-status = "http_status_cli.cli:main"

[tool.setuptools.packages.find]
include = ["http_status_cli*"]
